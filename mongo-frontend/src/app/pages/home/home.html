<div class="home-container">
  <!-- Hero o cabecera -->
  <section class="hero">
    <h1>Bienvenido a Mi Blog</h1>
    <p>Comparte ideas, explora publicaciones y descubre contenido interesante.</p>
  </section>

  <!-- Lista de publicaciones destacadas -->
  <section class="posts">
    <h2>Últimas publicaciones</h2>
    <div class="post-list">
      <article class="post-card" *ngFor="let post of posts">
        <h3>{{ post.title }}</h3>
        <p>{{ post.excerpt }}</p>
        <a [routerLink]="['/posts', post.id]" class="read-more">Leer más</a>
      </article>
    </div>
  </section>

</div>
